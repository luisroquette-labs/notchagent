name: Public release security

# 28/09/2026: sem trigger de push — sync-to-public já audita e roda
# swift test em todo push na master (era 3x macOS por push).
on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-15
    # Um run travou 6h (355 min) no swift test em 16/09/2026.
    timeout-minutes: 20
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fetch immutable public-history baseline
        run: git fetch --no-tags https://github.com/luisroquette-labs/notchagent.git master:refs/remotes/public-audit/master
      - name: Audit public source and history
        env:
          NOTCHAGENT_PUBLIC_HISTORY_BASE: refs/remotes/public-audit/master
        run: zsh Scripts/audit-public-release.sh
      - name: Validate GitHub Action pins
        run: zsh Scripts/check-github-actions-pins.sh
      - name: Validate release version
        run: zsh Scripts/check-version.sh
      - name: Validate product site
        run: python3 Scripts/validate-site.py
      - name: Test without paid probes
        env:
          NOTCHAGENT_DISABLE_PAID_PROBES: "1"
        run: swift test
