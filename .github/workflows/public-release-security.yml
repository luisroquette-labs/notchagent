name: Public release security

# Pull requests run portable public-source checks. The native Swift and
# App Store gates run once on the Mac before integration.
on:
  pull_request:

concurrency:
  group: public-release-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure audit tools are available
        run: sudo apt-get update -qq && sudo apt-get install -y zsh ripgrep
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Check comment ratchet
        run: python3 Tools/check-comments.py
      - name: Test comment ratchet
        run: python3 -m unittest Tools/test_check_comments.py
      - name: Fetch repository history baseline
        run: git fetch --no-tags origin master:refs/remotes/audit-baseline/master
      - name: Audit public source and history
        env:
          NOTCHAGENT_PUBLIC_HISTORY_BASE: refs/remotes/audit-baseline/master
        run: zsh Scripts/audit-public-release.sh
      - name: Validate GitHub Action pins
        run: zsh Scripts/check-github-actions-pins.sh
      - name: Validate release version
        run: zsh Scripts/check-version.sh
      - name: Validate product site
        run: python3 Scripts/validate-site.py
